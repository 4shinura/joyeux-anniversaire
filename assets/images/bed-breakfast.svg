<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="chambreBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a3b32"/>
      <stop offset="50%" stop-color="#8c5847"/>
      <stop offset="100%" stop-color="#d4a373"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" rx="16" fill="url(#chambreBg)"/>
  <!-- Cozy Window with Warm Light -->
  <rect x="330" y="100" width="140" height="150" rx="12" fill="#fff3b0" opacity="0.9"/>
  <line x1="400" y1="100" x2="400" y2="250" stroke="#8c5847" stroke-width="6"/>
  <line x1="330" y1="175" x2="470" y2="175" stroke="#8c5847" stroke-width="6"/>
  
  <!-- Little stars / cozy glow -->
  <circle cx="280" cy="140" r="4" fill="#fff" opacity="0.8"/>
  <circle cx="520" cy="160" r="5" fill="#fff" opacity="0.8"/>
  <circle cx="380" cy="70" r="3" fill="#fff" opacity="0.8"/>

  <!-- Bed Silhouette / Cozy Pillows -->
  <rect x="250" y="260" width="300" height="60" rx="10" fill="#fefae0"/>
  <rect x="230" y="300" width="340" height="40" rx="8" fill="#e9d8a6"/>
  <ellipse cx="320" cy="265" rx="35" ry="15" fill="#faedcd"/>
  <ellipse cx="480" cy="265" rx="35" ry="15" fill="#faedcd"/>

  <text x="400" y="390" font-family="'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="bold" fill="#ffffff" text-anchor="middle">CHAMBRE D'HÔTE COCOONING 🏡</text>
  <text x="400" y="430" font-family="'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="500" fill="#faedcd" text-anchor="middle">À 10 minutes du parc • Nuitée paisible &amp; détente en amoureux</text>
</svg>
